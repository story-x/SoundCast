name: Windows Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Superseded branch builds release their runner. Tag builds finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  INSTALL_DIR: ${{ github.workspace }}/install
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute package names
        run: |
          $beijingTimestamp = [DateTime]::UtcNow.AddHours(8).ToString("yyyyMMdd_HHmmss")
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $suffix = $env:GITHUB_REF_NAME
          } else {
              $suffix = "${env:GITHUB_REF_NAME}_$beijingTimestamp"
          }
          Write-Host "Configured package suffix: $suffix"
          "PACKAGE_SUFFIX=$suffix" >> $env:GITHUB_ENV
          "ZIP_NAME=SoundCast_${suffix}.zip" >> $env:GITHUB_ENV
          "MSI_NAME=SoundCast_${suffix}.msi" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=SoundCast_${suffix}_packages" >> $env:GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up WiX Toolset v5
        run: |
          $dotnetTools = Join-Path $env:USERPROFILE ".dotnet\tools"
          $dotnetTools >> $env:GITHUB_PATH
          $wixExe = Join-Path $dotnetTools "wix.exe"
          if (-not (Test-Path -LiteralPath $wixExe)) {
              dotnet tool install --global wix --version 5.0.2
          }
          & $wixExe extension add -g WixToolset.UI.wixext/5.0.2
          & $wixExe --version

      - name: Build Release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage install files
        run: |
          New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/SoundCast.exe" "$env:INSTALL_DIR/SoundCast.exe" -Force
          Copy-Item "README.md" "$env:INSTALL_DIR/README.md" -Force
          Copy-Item "LICENSE" "$env:INSTALL_DIR/LICENSE" -Force

      - name: Create ZIP
        run: |
          Compress-Archive -Path "$env:INSTALL_DIR/*" -DestinationPath "$env:GITHUB_WORKSPACE/$env:ZIP_NAME" -CompressionLevel Optimal -Force

      - name: Create MSI Installer
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build_msi.ps1 `
            -SourceDir "$env:INSTALL_DIR" `
            -OutputDir "$env:GITHUB_WORKSPACE" `
            -Version "$env:GITHUB_REF_NAME" `
            -OutMsiName "$env:MSI_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/${{ env.MSI_NAME }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 5

      - name: Resolve release notes
        id: release-notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $notesPath) {
              "body_path=$notesPath" >> $env:GITHUB_OUTPUT
              Write-Host "Using release notes from $notesPath"
          } else {
              "body_path=" >> $env:GITHUB_OUTPUT
              Write-Host "No $notesPath found; falling back to auto-generated notes."
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release-notes.outputs.body_path == '' }}
          files: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/${{ env.MSI_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
